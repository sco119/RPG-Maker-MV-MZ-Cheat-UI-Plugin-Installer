[package]
name = "RPG-Maker-MV-MZ-Cheat-UI-Plugin-Installer"
version = "0.3.2"
edition = "2021"
authors = ["SCO119"]

[dependencies]
slint = { version = "1.6", features = ["backend-winit"] }
rfd = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.4"
include_dir = "0.7"
i-slint-backend-winit = "1.6"

[build-dependencies]
slint-build = "1.6"
winres = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true